name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing secret KEYSTORE_BASE64, see the setup steps"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "dechainer.storeFile=$RUNNER_TEMP/release.jks"
            echo "dechainer.storePassword=$KEYSTORE_PASSWORD"
            echo "dechainer.keyAlias=$KEY_ALIAS"
            echo "dechainer.keyPassword=$KEY_PASSWORD"
          } >> local.properties

      - run: chmod +x gradlew

      - run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: dechainer-release-apk
          path: app/build/outputs/apk/release/*.apk
